name: Tests

on:
  push:
    paths: ['dataset-analysis-toolset/**', '.github/workflows/tests.yml']
  pull_request:
    paths: ['dataset-analysis-toolset/**', '.github/workflows/tests.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    defaults:
      run:
        working-directory: dataset-analysis-toolset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: dataset-analysis-toolset/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
